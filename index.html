body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#241049 0%,transparent 60%),radial-gradient(900px 500px at 0% 100%,#0b2a3f 0%,transparent 60%),var(--bg);
  color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.crt{position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px);
  box-shadow:inset 0 0 140px rgba(0,0,0,.55);opacity:.55}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--px);font-weight:400;line-height:1.5;margin:0}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(10,10,22,.92);border-bottom:2px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--px);font-size:14px;color:var(--cyan);text-shadow:2px 2px 0 var(--pink);cursor:pointer;background:none;border:0;padding:6px 4px}
.hud .sp{flex:1}
.btn{font-family:var(--px);font-size:11px;line-height:1.4;text-transform:uppercase;background:var(--bg2);color:var(--ink);border:3px solid var(--cyan);padding:12px 14px;min-height:46px;box-shadow:4px 4px 0 var(--pink);transition:transform .08s,box-shadow .08s}
.btn:hover{background:#1c1c40}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.btn.pri{background:var(--pink);border-color:#fff;color:#fff;box-shadow:4px 4px 0 var(--cyan)}
.btn.small{font-size:9px;padding:8px 10px;min-height:46px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{background:var(--cyan);color:#06121c;border-color:#fff}
main{max-width:1040px;margin:0 auto;padding:16px 14px 20px}
.panel{background:var(--panel);border:2px solid var(--line);padding:14px;position:relative}
.panel::before{content:"";position:absolute;left:-2px;top:-2px;width:14px;height:14px;border-left:4px solid var(--cyan);border-top:4px solid var(--cyan)}
.panel::after{content:"";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-right:4px solid var(--pink);border-bottom:4px solid var(--pink)}
.tag{font-family:var(--px);font-size:10px;color:var(--yellow);letter-spacing:1px;margin-bottom:8px}
.dim{color:var(--muted)}
.small{font-size:.85rem}
/* title */
.title{text-align:center;padding:30px 0 10px}
.glitch{font-family:var(--px);font-size:clamp(26px,7vw,56px);color:var(--ink);position:relative;display:inline-block;text-shadow:3px 3px 0 var(--pink),-3px -3px 0 var(--cyan);margin:6px 0 14px;animation:gl 4s infinite steps(1)}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translate(-3px,1px)}94%{transform:translate(3px,-1px)}95%{transform:translate(-2px,0)}96%{transform:none}}
.sub{font-family:var(--px);font-size:11px;line-height:2;color:var(--cyan);max-width:640px;margin:0 auto 18px}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.modedesc{max-width:560px;margin:0 auto;color:var(--muted);font-size:.92rem}
/* dialogue */
.mendel{display:flex;gap:12px}
.mendel p{margin:0;min-height:3.2em}
.typed::after{content:"_";animation:blink 1s steps(1) infinite;color:var(--cyan)}
@keyframes blink{50%{opacity:0}}
.speaker{font-family:var(--px);font-size:10px;color:var(--pink);margin-bottom:6px}
/* nucleus */
.nuc{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:10px 0}
.bulb{background:#0d0d20;border:2px solid #2a2a50;padding:2px 0 2px;overflow:hidden;color:#5a5a8a;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;min-height:46px}
.bulb svg{width:100%;height:auto;display:block}
.bulb i{font:normal 9px/1.2 "Courier New",monospace;color:#8c8cc0;margin-top:1px;word-break:break-all}
button.bulb:hover{border-color:var(--cyan)}
.bulb.on{color:var(--cyan);border-color:var(--cyan);background:#06222c;box-shadow:0 0 10px rgba(25,240,255,.35)}
.bulb.hk{color:var(--yellow);border-color:var(--yellow);background:#262006;box-shadow:0 0 10px rgba(255,230,0,.25)}
.bulb.id{color:var(--green);border-color:var(--green);background:#062616;box-shadow:0 0 12px rgba(57,255,136,.4)}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legendrow b{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
/* hub */
.hub{display:grid;grid-template-columns:240px 1fr;gap:16px}
.creature{text-align:center}
.orgsvg{width:100%;max-width:210px;margin:4px auto 8px}
.orgsvg svg{width:100%;height:auto;display:block;overflow:visible}
.genome{border:2px solid var(--cyan);background:#0a0a1e;padding:8px 10px 4px;margin:10px 0;box-shadow:0 0 14px rgba(25,240,255,.18)}
.gtag{font-family:var(--px);font-size:9px;line-height:1.6;color:var(--cyan);margin-bottom:2px}
.meter{font-family:var(--px);font-size:9px;line-height:1.8;color:var(--cyan)}
.missions{display:flex;flex-direction:column;gap:10px}
.mission{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg2);border:2px solid var(--line);padding:10px 12px;min-height:56px;width:100%}
.mission .no{font-family:var(--px);font-size:11px;color:var(--yellow);width:28px;flex:none}
.mission .nm{font-family:var(--px);font-size:11px;line-height:1.5;flex:1}
.mission .nm small{display:block;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted);margin-top:2px}
.mission .st{font-family:var(--px);font-size:10px;color:var(--cyan)}
.mission.done{border-color:var(--green)}
.mission.done .st{color:var(--green)}
.mission.open{border-color:var(--pink);box-shadow:0 0 14px rgba(255,46,136,.35)}
.mission.lock{opacity:.45}
/* board */
.b-top{display:grid;grid-template-columns:200px 1fr;gap:14px;margin-bottom:14px}
.sprite{text-align:center}
.sprite canvas{width:168px;height:168px;display:block;margin:0 auto}
.sprite.alive canvas{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.sprite .lbl{font-family:var(--px);font-size:9px;line-height:1.6;margin-top:6px;color:var(--cyan)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--px);font-size:9px;border:2px solid var(--line);padding:6px 8px;background:var(--bg2);color:var(--ink)}
.b-main{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel h3{font-size:11px;color:var(--cyan);margin-bottom:10px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg2);border:2px dashed #4a4a8a;padding:10px;min-height:56px;width:100%}
.slot .n{font-family:var(--px);font-size:10px;color:var(--yellow);flex:none}
.slot .clue{flex:1;font-size:.95rem}
.slot .val{font-family:var(--px);font-size:9px;color:var(--green);text-align:right;flex:none;max-width:42%;line-height:1.5}
.slot.sel{border-color:var(--yellow);box-shadow:0 0 12px rgba(255,230,0,.4)}
.slot.ok{border:2px solid var(--green);background:#062616}
.slot.ok .clue{color:#bdf5d4}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--bg2);border:2px solid var(--violet);padding:8px 10px;min-height:68px;position:relative;cursor:pointer}
.card .sym{font-family:var(--px);font-size:10px;color:var(--yellow)}
.card .pn{display:block;font-weight:700;font-size:.9rem;margin-top:4px;line-height:1.25;padding-right:22px}
.card .fn{display:block;font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.3}
.card .info{position:absolute;right:4px;top:4px;width:30px;height:30px;border:2px solid var(--cyan);background:#06222c;color:var(--cyan);font-family:var(--px);font-size:10px;padding:0}
.arch .card .fn{display:none}
.arch .card.open .fn{display:block}
.explorer .card .info{display:none}
.card.sel{border-color:var(--yellow);box-shadow:0 0 14px rgba(255,230,0,.5);background:#262006}
.card.used{display:none}
.fb{margin-top:10px;min-height:3.2em;padding:10px 12px;border-left:5px solid var(--line);background:#0d0d20;font-size:.95rem}
.fb.good{border-color:var(--green);color:#c8ffe0}
.fb.bad{border-color:var(--red);color:#ffd0d5}
.fb b{font-family:var(--px);font-size:10px;display:block;margin-bottom:4px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,0)}40%{transform:translate(5px,0)}60%{transform:translate(-3px,0)}80%{transform:translate(3px,0)}}
.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 rgba(255,77,94,0)}40%{box-shadow:0 0 22px rgba(255,77,94,.9)}100%{box-shadow:none}}
/* reveal */
.reveal h2{color:var(--green);font-size:16px;text-shadow:2px 2px 0 #064}
.big{font-family:var(--px);font-size:22px;color:var(--yellow)}
.grade{font-family:var(--px);font-size:34px;color:var(--pink);text-shadow:3px 3px 0 var(--cyan)}
.callout{border-left:5px solid var(--cyan);background:#06222c;padding:10px 12px;margin:12px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,3,12,.82);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 12px}
.modal{background:var(--panel);border:3px solid var(--cyan);box-shadow:6px 6px 0 var(--pink);max-width:760px;width:100%;padding:18px 20px;margin:auto}
.modal h2{font-size:15px;color:var(--cyan);margin-bottom:8px}
.modal h3{font-size:11px;color:var(--yellow);margin:16px 0 6px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pair{display:flex;gap:12px;flex-wrap:wrap}
.pair>div{flex:1 1 240px;border:2px solid var(--line);padding:10px;text-align:center}
.pair svg{width:100%;max-width:220px;height:auto}
.pair .off{color:#8a8ab5}.pair .on{color:var(--cyan)}
/* expert */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.sw{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg2);border:2px solid #34346a;padding:8px;min-height:64px;color:#8a8ab5}
.sw svg{width:104px;height:auto;flex:none}
.sw .t{font-size:.85rem;color:var(--ink);line-height:1.25}
.sw .t b{display:block;font-family:var(--px);font-size:9px;color:var(--yellow);margin-bottom:3px}
.sw[aria-checked=true]{border-color:var(--cyan);background:#06222c;color:var(--cyan)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,10,22,.96);border-top:2px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
input[type=search]{background:#0d0d20;color:var(--ink);border:2px solid var(--line);padding:10px;min-height:46px;width:100%;font:inherit}
.site-foot{max-width:1040px;margin:20px auto 80px;padding:10px 14px 0;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;font-size:.8rem;color:var(--muted);position:relative;z-index:2}
.site-foot a{color:var(--muted)}
.cc{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--muted)}
.cc span{font-family:var(--px);font-size:9px;margin-left:6px}
.cc:hover{color:var(--cyan)}
.site-foot .sig{margin-left:auto;text-align:right;font-family:var(--px);font-size:11px;color:var(--cyan);text-shadow:2px 2px 0 var(--pink)}
ul.plain{padding-left:20px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
@media (max-width:820px){
  .hub{grid-template-columns:1fr}
  .orgsvg{max-width:150px}
  .b-top{grid-template-columns:1fr}
  .sprite canvas{width:120px;height:120px}
  .b-main{grid-template-columns:1fr}
  .hud .btn.small{padding:8px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.typed::after{animation:none!important}}
</style>

es (cerveau et moelle épinière)", "group": "oligo"}, {"id": "RHO", "name": "Rhodopsine", "fn": "Détecte la lumière dans les bâtonnets, les cellules de la vision en lumière faible.", "where": "Bâtonnets de la rétine", "group": "x"}, {"id": "PGA3", "name": "Pepsinogène A", "fn": "Précurseur de la pepsine, enzyme qui digère les protéines.", "where": "Estomac", "group": "x"}, {"id": "ALB", "name": "Albumine", "fn": "Protéine très abondante du plasma sanguin.", "where": "Foie", "group": "x"}, {"id": "CRYAA", "name": "Cristalline αA", "fn": "Protéine qui rend le cristallin transparent et protège les autres protéines.", "where": "Cristallin de l'œil", "group": "x"}, {"id": "LCT", "name": "Lactase", "fn": "Enzyme qui digère le lactose du lait.", "where": "Intestin grêle", "group": "x"}, {"id": "MYH6", "name": "Myosine α cardiaque", "fn": "Moteur moléculaire de la contraction du cœur.", "where": "Muscle cardiaque", "group": "x"}, {"id": "ACTC1", "name": "Actine α cardiaque", "fn": "Filaments d'actine de la contraction du cœur.", "where": "Muscle cardiaque", "group": "x"}, {"id": "GFAP", "name": "Protéine gliale fibrillaire acide", "fn": "Forme les filaments des astrocytes, cellules de soutien du cerveau.", "where": "Astrocytes (cellules gliales)", "group": "x"}], "cells": [{"key": "kerat", "name": "Kératinocyte", "mission": "Construis la cellule principale de l'épiderme, la couche externe de la peau.", "fiche": "Cette cellule forme une barrière solide. Elle naît dans la couche profonde, puis se différencie en montant vers la surface, où elle finit par être éliminée et remplacée.", "won": "Les kératinocytes forment l'essentiel de l'épiderme. Ceux de la couche profonde fabriquent surtout la kératine 14 ; en montant, ils fabriquent d'autres kératines, comme la 10, puis la filaggrine.", "dyk": "Les mélanocytes vivent dans la même couche profonde de l'épiderme. Ils ont exactement le même génome que les kératinocytes, mais n'allument pas les mêmes gènes.", "bonus": false}, {"key":    '<div class="panel"><h3>PROTÉINES DISPONIBLES</h3><div class="hand" id="hand"></div></div></div></section>';

function renderStats(){$('#stats').innerHTML='<span class="chip">ERREURS '+B.err+'</span><span class="chip">INDICES '+Object.keys(B.filled).length+'/'+B.cfg.slots.length+'</span><span class="chip">SCORE '+B.pts+'</span>';}
function renderSlots(){
  $('#slots').innerHTML=B.cfg.slots.map(function(s,i){
    var f=B.filled[i],g=GENES[s.gene];
    return '<button type="button" class="slot'+(f?' ok':'')+(B.selSlot===i?' sel':'')+'" data-slot="'+i+'"><span class="n">'+('0'+(i+1))+'</span><span class="clue">'+esc(s.clue)+'</span>'+(f?'<span class="val">'+esc(g.id)+'</span>':'')+'</button>';
  }).join('');
}
function renderHand(){
  $('#hand').innerHTML=B.hand.map(function(id){
    var g=GENES[id],used=B.cfg.slots.some(function(s,i){return B.filled[i]&&s.gene===id;});
    return '<div class="card'+(used?' used':'')+(B.sel===id?' sel':'')+(B.open[id]?' open':'')+'" role="button" tabindex="0" data-card="'+id+'"><span class="sym">'+esc(id)+'</span><span class="pn">'+esc(g.name)+'</span><span class="fn">'+esc(g.fn)+'</span><button type="button" class="info" data-info="'+id+'" aria-label="Voir la description">i</button></div>';
  }).join('');
}
function say(kind,title,text){var f=$('#fb');f.className='fb '+kind;f.innerHTML='<b>'+esc(title)+'</b>'+esc(text);}
function tryAttempt(){
  if(B.sel==null||B.selSlot==null)return;
  var gene=B.sel,i=B.selSlot,slot=B.cfg.slots[i];B.sel=null;B.selSlot=null;
  if(gene===slot.gene){
    var pts=Math.max(25,100-25*B.slotErr[i]);B.pts+=pts;B.filled[i]=true;sfx.ok();
    say('good','CONNEXION OK','+'+pts+' points. '+GENES[gene].name+' : '+GENES[gene].fn);
  }else{
    B.err++;B.slotErr[i]++;sfx.bad();
    var g=GENES[gene],mine=B.cfg.slots.some(function(s){return s.gene===gene;});
    var msg=mine?g.id+' sert bien ici, mais ne répond pas à cet indice. Relis l\'indice et la description.':
      'Pas ici. '+g.id+' : '+g.fn+' On la trouve surtout dans : '+g.where.charAt(0).toLowerCase()+g.where.slice(1)+'.';
    say('bad','ERREUR DE CONNEXION',msg);
    app.classList.remove('shake');void app.offsetWidth;if(!reduce)app.classList.add('shake');
  }
  renderSlots();renderHand();renderStats();
  if(Object.keys(B.filled).length===B.cfg.slots.length){setTimeout(function(){sfx.win();B.cfg.onDone(B);},700);}
}

SCREENS.expertpick=function(){
  app.className='';
  var rows=ORDER.concat([BONUS]).map(function(k){var e=S.expert[k];return '<button type="button" class="mission open" data-xcell="'+k+'"><span class="no">'+(e?'OK':'>>')+'</span><span class="nm">'+esc(CELLS[k].name)+'<small>'+esc(CELLS[k].mission)+'</small></span><span class="st">'+(e?e.tests+' T':'')+'</span></button>';}).join('');
  app.innerHTML='<section><div class="panel missions"><div class="tag">MODE EXPERT</div><p>Tu as les 40 gènes sous les yeux. Allume ceux de ta cellule (entretien et identité) et teste. Le test te dit ce qui ne va pas, jamais quel gène est en cause.</p>'+rows+'</div></section>';
};
SCREENS.expert=function(k){
  app.className='';X={k:k,on:{},tests:0,q:''};
  app.innerHTML='<section><div class="panel"><div class="tag">EXPERT // '+esc(CELLS[k].name.toUpperCase())+'</div><p>'+esc(CELLS[k].mission)+' '+esc(CELLS[k].fiche)+'</p><div class="stats"><span class="chip" id="xon"></span><span class="chip" id="xt"></span></div><div class="fb" id="xfb"></div><input type="search" id="xq" placeholder="Chercher un gène ou une fonction" aria-label="Chercher"><div class="exgrid" id="xgrid"></div></div></section>'+
   '<div class="bar"><button class="btn small" type="button" data-xclear="1">Tout éteindre</button><button class="btn pri small" type="button" data-xtest="1">Tester la cellule</button></div>';
  renderX();
};
function renderX(){
  var q=X.q.toLowerCase();
  $('#xgrid').innerHTML=DATA.genes.slice().sort(function(a,b){return a.id<b.id?-1:1;}).filter(function(g){return !q||(g.id+' '+g.name+' '+g.fn).toLowerCase().indexOf(q)>=0;}).map(function(g){
    var on=!!X.on[g.id];return '<button type="button" class="sw" role="switch" aria-checked="'+on+'" data-xg="'+g.id+'">'+(on?ICON_ON:ICON_OFF)+'<span class="t"><b>'+esc(g.id)+' '+(on?'ON':'OFF')+'</b>'+esc(g.name)+'</span></button>';}).join('');
  $('#xon').textContent='GÈNES ON '+Object.keys(X.on).filter(function(i){return X.on[i];}).length+'/40';$('#xt').textContent='TESTS '+X.tests;
}
function xTest(){
  X.tests++;var k=X.k,on=X.on;
  var hk=HK.filter(function(i){return !on[i];}).length,id=idsOf(k).filter(function(i){return !on[i];}).length,ex=DATA.genes.filter(function(g){return g.group!=='hk'&&g.group!==k&&on[g.id];}).length;
  var f=$('#xfb');
  if(!hk&&!id&&!ex){
    var best=S.expert[k];if(!best||X.tests<best.tests)S.expert[k]={tests:X.tests};save();sfx.win();
    f.className='fb good';f.innerHTML='<b>CELLULE PROGRAMMÉE EN '+X.tests+' TEST'+(X.tests>1?'S':'')+'</b>'+esc(CELLS[k].won)+'<div class="row2"><button class="btn pri" type="button" data-go="expertpick">Autre cellule</button></div>';
  }else{
    var m=[];if(hk)m.push('Cellule non viable : il manque des gènes d\'entretien.');if(id)m.push('Différenciation incomplète : il manque des gènes d\'identité.');if(ex)m.push('Identité brouillée : des gènes d\'autres cellules sont allumés.');
    sfx.bad();f.className='fb bad';f.innerHTML='<b>TEST '+X.tests+' : ÉCHEC</b>'+m.map(esc).join('<br>');
  }
  renderX();
  var ff=$('#xfb');if(ff&&ff.scrollIntoView)ff.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});
}

/* ---------- mémo, infos ---------- */
function openModal(html,onClose){$('#modal').innerHTML='<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';var b=$('#modal [data-act="close"]');if(b)b.focus();}
function closeModal(){$('#modal').innerHTML='';}
function memo(){
  openModal('<h2>MÉMO</h2><h3>Du gène à la protéine</h3><p>Un <b>gène</b> est un morceau d\'ADN qui contient l\'information pour fabriquer une <b>protéine</b>. Gène <b>ON</b> : la cellule le transcrit en ARN messager, puis un ribosome fabrique la protéine (traduction). Gène <b>OFF</b> : pas de transcription, donc pas de protéine. Les protéines font le travail de la cellule.</p>'+
   '<h3>Qu\'est-ce qu\'une enzyme ?</h3><p>Une <b>enzyme</b> est une protéine qui <b>accélère une réaction chimique</b> de la cellule, sans être détruite. Elle est <b>spécifique</b> : une seule réaction, comme une clé qui n\'ouvre qu\'une serrure.</p><ul class="plain"><li>La molécule transformée est le <b>substrat</b>, le résultat est le <b>produit</b>. Exemple : la <b>lactase</b> transforme le lactose en glucose et galactose.</li><li>Son nom finit souvent par <b>-ase</b> (lactase, tyrosinase, protéase).</li><li>Toutes les protéines ne sont pas des enzymes : la kératine, l\'actine, l\'hémoglobine et l\'insuline n\'en sont pas.</li></ul>'+
   '<h3>ON et OFF : l\'ADN condensé ou décondensé</h3><p>Dans le noyau, l\'ADN est enroulé autour de protéines appelées <b>histones</b> : c\'est la <b>chromatine</b>. Elle peut être très serrée ou plus ouverte.</p><div class="pair"><div class="off">'+ICON_OFF+'<p><b>OFF</b> : ADN <b>condensé</b>, entouré de nombreuses histones (violet).<br>Le gène est inaccessible : pas de transcription.</p></div><div class="on">'+ICON_ON+'<p><b>ON</b> : ADN <b>décondensé</b>.<br>Le gène est accessible : l\'ARN polymérase (nuage) le transcrit en ARN messager (brin du bas).</p></div></div><p class="small dim">Modèle simplifié : dans la réalité, des facteurs de transcription aident aussi à activer un gène, et les gènes du jeu se trouvent sur des chromosomes différents. Ici, ils sont dessinés sur une seule molécule d\'ADN pour montrer que certains gènes sont ON et d\'autres OFF dans la même cellule.</p>'+
   '<h3>Gènes d\'entretien et gènes d\'identité</h3><ul class="plain"><li><b>Entretien</b> : fonctions dont toutes les cellules ont besoin (énergie, lecture des gènes, fabrication et recyclage des protéines, forme, réparation de l\'ADN). ON partout.</li><li><b>Identité</b> : ce que fait cette cellule et aucune autre. ON seulement dans elle.</li></ul><div class="row"><button class="btn pri" type="button" data-act="close">Fermer</button></div>');
}
SCREENS.about=function(){
  app.className='';
  app.innerHTML='<section><div class="panel"><div class="tag">INFOS</div><h3>Ce que ce jeu simplifie</h3><ul class="plain">'+
   '<li>Un vrai organisme se construit à partir d\'une seule cellule (l\'œuf, ou zygote). Ses tissus apparaissent pendant le développement, grâce à des signaux entre cellules. Ici, tu choisis directement les gènes allumés dans chaque type de cellule.</li>'+
   '<li>ORGANISME-0 est imaginaire. Ses 40 gènes sont des gènes humains réels, choisis parmi des milliers (un génome humain compte environ 20 000 gènes codant des protéines).</li>'+
   '<li>« Gène d\'entretien » veut dire exprimé dans presque toutes les cellules, à des niveaux variables. OFF veut parfois dire « presque éteint ».</li><li>Sur les dessins, les gènes sont sur une seule molécule d\'ADN. En réalité, ils sont répartis sur plusieurs chromosomes. La condensation de l\'ADN n\'est qu\'un des mécanismes qui règlent l\'activité des gènes.</li>'+
   '<li>Dans la réalité, un gène allumé en trop ne tue pas forcément la cellule : le jeu exige une signature nette pour que le raisonnement reste lisible.</li>'+
   '<li>Le globule rouge mature n\'a plus de noyau : le jeu utilise donc l\'érythroblaste, son précurseur.</li></ul>'+
   '<h3>Sources</h3><ul class="plain"><li>Human Protein Atlas (proteinatlas.org) et articles de PubMed Central sur les types cellulaires du jeu.</li><li>Police « Press Start 2P » : licence SIL Open Font 1.1.</li><li>Style graphique inspiré des jeux pixel art néon, avec des visuels originaux.</li></ul>'+
   '<h3>Auteur et licence</h3><p>Jeu créé par M. Scansetti, licence <a style="color:var(--cyan)" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>.</p>'+
   '<h3>Options</h3><div class="row2"><button class="btn small" type="button" data-act="unlock">Tout débloquer : '+(S.unlockAll?'oui':'non')+'</button><button class="btn small" type="button" data-act="reset">Effacer ma progression</button></div><p class="small dim">La progression est enregistrée dans ce navigateur. Rien n\'est envoyé nulle part.</p></div></section>';
};

/* ---------- événements ---------- */
document.addEventListener('click',function(e){
  var t=e.target,m;
  if((m=t.closest('[data-info]'))){e.stopPropagation();var id=m.dataset.info;B.open[id]=!B.open[id];renderHand();return;}
  if((m=t.closest('[data-card]'))&&B){var id2=m.dataset.card;B.sel=(B.sel===id2?null:id2);sfx.tap();renderHand();tryAttempt();return;}
  if((m=t.closest('[data-slot]'))&&B){var i=parseInt(m.dataset.slot,10);if(B.filled[i])return;B.selSlot=(B.selSlot===i?null:i);sfx.tap();renderSlots();tryAttempt();return;}
  if((m=t.closest('[data-bulb]'))){introBulb(m.dataset.bulb);return;}
  if((m=t.closest('[data-case]'))){sfx.tap();go('case',m.dataset.case);return;}
  if((m=t.closest('[data-fopt]'))){finalAnswer(m.dataset.fopt);return;}
  if(t.closest('[data-fnext]')){finalNext();return;}
  if((m=t.closest('[data-xcell]'))){go('expert',m.dataset.xcell);return;}
  if((m=t.closest('[data-xg]'))){X.on[m.dataset.xg]=!X.on[m.dataset.xg];sfx.tap();renderX();return;}
  if(t.closest('[data-xtest]')){xTest();return;}
  if(t.closest('[data-xclear]')){X.on={};renderX();return;}
  if((m=t.closest('[data-go]'))){sfx.tap();B=null;go(m.dataset.go);return;}
  if((m=t.closest('[data-act]'))){
    var a=m.dataset.act;
    if(a==='memo')memo();else if(a==='close')closeModal();
    else if(a==='sound'){S.sound=!S.sound;save();updSound();}
    else if(a==='unlock'){S.unlockAll=!S.unlockAll;save();go('about');}
    else if(a==='reset'){openModal('<h2>Effacer ?</h2><p>Les scores et la progression seront perdus.</p><div class="row"><button class="btn" type="button" data-act="close">Annuler</button><button class="btn pri" type="button" data-act="reset2">Effacer</button></div>');}
    else if(a==='reset2'){S=def();save();closeModal();go('title');}
    return;
  }
  if(t.id==='ov')closeModal();
});
document.addEventListener('input',function(e){if(e.target.id==='xq'&&X){X.q=e.target.value;renderX();}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#ov')){closeModal();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&(e.target.dataset.card||e.target.dataset.slot)){e.preventDefault();e.target.click();}
});

updSound();go('title');
window.__GS={DATA:DATA,S:function(){return S;},go:go,B:function(){return B;},F:function(){return F;},X:function(){return X;},idsOf:idsOf};
})();

</script>
